[package]
name = "rust-strom"
version = "2.0.0"
edition = "2021"
description = "RustStrom - HTTP(S) load balancer on Cloudflare Pingora"
license = "MIT"

[workspace]
members = [".", "crates/ruststrom-acme"]

[dependencies]
# ACME client (HTTP-01), see src/acme.rs
ruststrom-acme = { path = "crates/ruststrom-acme" }

# Data plane
pingora-core = { version = "0.9.1", default-features = false, features = ["openssl"] }
pingora-proxy = { version = "0.9.1", default-features = false, features = ["openssl"] }
pingora-http = "0.9.1"
# Static OpenSSL so the musl build does not need a system libssl
openssl = { version = "0.10", features = ["vendored"] }

# Core utilities
arc-swap = "1.7"
async-trait = "0.1"
bytes = "1"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }

# CLI and config
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context"] }
toml = { version = "0.5.11", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
notify = "4.0"

# Logging and metrics
log = "0.4"
log4rs = { version = "1.3", default-features = false, features = ["console_appender", "pattern_encoder"] }
prometheus = { version = "0.14.0", default-features = false }

# Middlewares
http-auth-basic = "0.3.3"
ldap3 = "0.11.3"
cookie = "0.17"

# Other
fnv = "1.0.7"
linked-hash-map = "0.5"
gethostname = "0.4.3"
pom = "3.2"
rand = "0.8"
regex = "1.4"
url = "2.2"

# Allocator: musl's default malloc serialises on a global lock under multi-core load
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"           # A panic kills only the affected request task, not the whole proxy
strip = true

# pingora-core enables flate2/zlib-ng; upstream libz-ng-sys needs cmake. The vendored copy builds
# the same zlib-ng sources with `cc` (see vendor/libz-ng-sys/README.ruststrom.md).
[patch.crates-io]
libz-ng-sys = { path = "vendor/libz-ng-sys" }
