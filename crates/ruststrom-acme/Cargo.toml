[package]
name = "ruststrom-acme"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Async ACME (RFC 8555) HTTP-01 certificate manager for RustStrom"
publish = false

[dependencies]
# ACME protocol client. Default features are off so that no platform verifier,
# native cert loader or aws-lc-rs (C/cmake) is pulled in: we bring our own
# rustls (ring) HTTP client, which keeps static musl builds simple.
instant-acme = { version = "0.8.5", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
x509-parser = { version = "0.18", default-features = false }
rustls-pki-types = { version = "1.12", features = ["std"] }

# HTTP client for instant-acme (rustls + ring, webpki roots, no OpenSSL).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http = "1"
bytes = "1"

tokio = { version = "1", features = ["fs", "rt", "sync", "time"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
